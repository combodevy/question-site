<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>管理控制台 - 在线刷题平台</title>
    <meta name="theme-color" content="#0F766E" />
    <link
      rel="icon"
      type="image/svg+xml"
      href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='none' stroke='%230F766E' stroke-width='2' stroke-linecap='round' stroke-linejoin='round'%3E%3Cpath d='M12 6V4m0 2a2 2 0 100 4m0-4a2 2 0 110 4m-6 8a2 2 0 100-4m0 4a2 2 0 110-4m0 4v2m0-6V4m6 6v10m6-2a2 2 0 100-4m0 4a2 2 0 110-4m0 4v2m0-6V4'/%3E%3C/svg%3E"
    />
    <script>
      (function () {
        try {
          var pref = localStorage.getItem('qs_theme');
          var darkLegacy = localStorage.getItem('dark');
          var isDark =
            pref === 'dark' ||
            (pref !== 'light' &&
              (darkLegacy === '1' ||
                (darkLegacy !== '0' &&
                  window.matchMedia &&
                  window.matchMedia('(prefers-color-scheme: dark)').matches)));
          if (isDark) document.documentElement.classList.add('dark');
        } catch (e) {}
      })();
    </script>
  </head>
  <body class="bg-canvas text-ink antialiased selection:bg-accent-soft selection:text-accent">
    <div id="admin-root"></div>
    <script type="module" src="/src/admin/main.tsx"></script>
  </body>
</html>
