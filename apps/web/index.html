<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0" />
    <title>研习书桌 · 在线刷题与记忆巩固平台</title>
    <meta name="theme-color" content="#0F766E" />
    <link
      rel="icon"
      type="image/svg+xml"
      href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='none' stroke='%230F766E' stroke-width='2' stroke-linecap='round' stroke-linejoin='round'%3E%3Cpath d='M9 12l2 2 4-4m6 2a9 9 0 11-18 0 9 9 0 0118 0z'/%3E%3C/svg%3E"
    />
    <script>
      (function () {
        try {
          var pref = localStorage.getItem('qs_theme');
          var darkLegacy = localStorage.getItem('dark');
          var isDark =
            pref === 'dark' ||
            (pref !== 'light' &&
              (darkLegacy === '1' ||
                (darkLegacy !== '0' &&
                  window.matchMedia &&
                  window.matchMedia('(prefers-color-scheme: dark)').matches)));
          if (isDark) document.documentElement.classList.add('dark');
        } catch (e) {}
      })();
    </script>
  </head>
  <body class="bg-canvas text-ink antialiased selection:bg-accent-soft selection:text-accent">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
